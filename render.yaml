databases:
  - name: danandshay-db
    plan: free
    databaseName: danandshay
    user: danandshay

services:
  - type: web
    name: danandshay-platform
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: danandshay-db
          property: connectionString
